<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      window.addEventListener(
        'error',
        function (event) {
          var src = event && (event.filename || '');
          var stack = (event && event.error && event.error.stack) || '';
          if (src.indexOf('chrome-extension://') === 0 || stack.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
    <title>BowelSound-AP — Acute Pancreatitis Acoustic Monitoring & CDSS</title>
    <meta name="description" content="Clinical and research web platform for dynamic severity assessment, therapy response monitoring, and outcome prediction in acute pancreatitis using intestinal peristalsis acoustic analysis." />
    <meta property="og:title" content="BowelSound-AP — Acute Pancreatitis Acoustic Monitoring & CDSS" />
    <meta property="og:description" content="Automated phonoenterography, CRNN acoustic event detection, severity scales, and outcome forecasting for acute pancreatitis." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>

  </body>
</html>
